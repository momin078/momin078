
name: Auto-update Profile Project Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: auto-update-project-cards
  cancel-in-progress: false

jobs:
  update-project-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Update README project cards
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPOSITORIES_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace("refs/heads/", "");

            const START = "<!-- AUTO-PROJECTS:START -->";
            const END = "<!-- AUTO-PROJECTS:END -->";

            const escapeHtml = (value = "") =>
              String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
              })[char]);

            // Fetch all repositories owned by the authenticated user.
            const repositories = await github.paginate(
              github.rest.repos.listForAuthenticatedUser,
              {
                visibility: "all",
                affiliation: "owner",
                sort: "updated",
                direction: "desc",
                per_page: 100
              }
            );

            // Do not display the profile README repository itself.
            const projects = repositories.filter(
              project => project.name.toLowerCase() !== owner.toLowerCase()
            );

            core.info(`Repositories found: ${repositories.length}`);
            core.info(`Project cards to display: ${projects.length}`);

            const cards = projects.map((project, index) => {
              const number = String(index + 1).padStart(2, "0");
              const name = escapeHtml(project.name);
              const description = escapeHtml(
                project.description || "A project by " + owner + "."
              );
              const language = escapeHtml(project.language || "Various");
              const url = escapeHtml(project.html_url);
              const stars = project.stargazers_count;
              const visibility = project.private ? "PRIVATE" : "PUBLIC";

              return `
              <td width="50%" valign="top">

              <img src="https://img.shields.io/badge/${number}%20${visibility}-PROJECT-C5FF63?style=flat-square&labelColor=17191D" alt="${visibility} project" />

              <h3><a href="${url}">${name}</a></h3>

              <p>${description}</p>

              <p><code>${language}</code> · ⭐ ${stars} stars</p>

              <a href="${url}">
                <img src="https://img.shields.io/badge/VIEW%20PROJECT-C5FF63?style=for-the-badge&logo=github&logoColor=111111" alt="View project" />
              </a>

              </td>`;
            });

            const rows = [];

            for (let i = 0; i < cards.length; i += 2) {
              const secondCard = cards[i + 1] ||
                '<td width="50%" valign="top"></td>';

              rows.push(`
              <tr>
              ${cards[i]}
              ${secondCard}
              </tr>`);
            }

            const projectSection = cards.length
              ? `<table width="100%">
              ${rows.join("\n")}
              </table>`
              : "<p>No repositories found.</p>";

            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: "README.md",
              ref: branch
            });

            if (Array.isArray(response.data) ||
                response.data.type !== "file") {
              throw new Error("README.md was not found.");
            }

            const current = Buffer.from(
              response.data.content,
              "base64"
            ).toString("utf8");

            const startIndex = current.indexOf(START);
            const endIndex = current.indexOf(END);

            if (
              startIndex === -1 ||
              endIndex === -1 ||
              endIndex < startIndex
            ) {
              throw new Error(
                "AUTO-PROJECTS markers are missing or incorrectly ordered."
              );
            }

            const updated =
              current.slice(0, startIndex + START.length) +
              "\n\n" + projectSection + "\n\n" +
              current.slice(endIndex);

            if (updated === current) {
              core.info("Project cards are already up to date.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "README.md",
              message: "docs: update all repository project cards",
              content: Buffer.from(updated, "utf8").toString("base64"),
              sha: response.data.sha,
              branch
            });

            core.info(
              `Successfully updated ${projects.length} project cards.`
            );
