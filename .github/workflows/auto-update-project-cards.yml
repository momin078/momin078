
name: Auto-update Profile Project Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: auto-update-project-cards
  cancel-in-progress: false

jobs:
  update-project-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Update README project cards
        uses: actions/github-script@v7

        env:
          REPOSITORIES_TOKEN: ${{ secrets.REPOSITORIES_TOKEN }}

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const { getOctokit } = require("@actions/github");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace("refs/heads/", "");

            const START = "<!-- AUTO-PROJECTS:START -->";
            const END = "<!-- AUTO-PROJECTS:END -->";

            if (!process.env.REPOSITORIES_TOKEN) {
              throw new Error("REPOSITORIES_TOKEN secret is missing.");
            }

            // Use a read-only PAT to discover public and private repos.
            const reader = getOctokit(
              process.env.REPOSITORIES_TOKEN
            );

            const repositories = await reader.paginate(
              reader.rest.repos.listForAuthenticatedUser,
              {
                visibility: "all",
                affiliation: "owner",
                sort: "updated",
                direction: "desc",
                per_page: 100
              }
            );

            // Include public, private and archived repositories.
            const projects = repositories;

            core.info(`Repositories found: ${projects.length}`);

            const escapeHtml = (value = "") =>
              String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
              })[char]);

            const cards = projects.map((project, index) => {
              const number = String(index + 1).padStart(2, "0");
              const name = escapeHtml(project.name);
              const description = escapeHtml(
                project.description ||
                "A repository owned by " + owner + "."
              );
              const language = escapeHtml(
                project.language || "Various"
              );
              const url = escapeHtml(project.html_url);
              const stars = project.stargazers_count;

              const visibility = project.private
                ? "PRIVATE"
                : "PUBLIC";

              const visibilityColor = project.private
                ? "A99BFF"
                : "C5FF63";

              return `
              <td width="50%" valign="top">

              <img src="https://img.shields.io/badge/${number}-${visibility}-${visibilityColor}?style=flat-square&labelColor=17191D" alt="${visibility} repository" />

              <h3><a href="${url}">${name}</a></h3>

              <p>${description}</p>

              <p><code>${language}</code> · ⭐ ${stars} stars</p>

              <a href="${url}">
                <img src="https://img.shields.io/badge/VIEW%20PROJECT-C5FF63?style=for-the-badge&logo=github&logoColor=111111" alt="View project" />
              </a>

              </td>`;
            });

            const rows = [];

            for (let i = 0; i < cards.length; i += 2) {
              const secondCard = cards[i + 1] ||
                '<td width="50%"></td>';

              rows.push(`
              <tr>
              ${cards[i]}
              ${secondCard}
              </tr>`);
            }

            const projectSection = cards.length
              ? `<table width="100%">
              ${rows.join("\n")}
              </table>`
              : "<p>No repositories found.</p>";

            // Read the profile README using GITHUB_TOKEN.
            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: "README.md",
              ref: branch
            });

            if (
              Array.isArray(response.data) ||
              response.data.type !== "file"
            ) {
              throw new Error("README.md was not found.");
            }

            const current = Buffer.from(
              response.data.content,
              "base64"
            ).toString("utf8");

            if (
              current.split(START).length !== 2 ||
              current.split(END).length !== 2
            ) {
              throw new Error(
                "README must contain exactly one START marker and one END marker."
              );
            }

            const startIndex = current.indexOf(START);
            const endIndex = current.indexOf(END);

            if (endIndex < startIndex) {
              throw new Error(
                "README project markers are incorrectly ordered."
              );
            }

            const updated =
              current.slice(0, startIndex + START.length) +
              "\n\n" +
              projectSection +
              "\n\n" +
              current.slice(endIndex);

            if (updated === current) {
              core.info("Project cards are already up to date.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "README.md",
              message: "docs: automatically update all project cards",
              content: Buffer.from(updated, "utf8").toString("base64"),
              sha: response.data.sha,
              branch
            });

            core.info(
              `Successfully updated ${projects.length} repositories.`
            );
