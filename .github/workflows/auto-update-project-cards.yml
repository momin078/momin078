
name: Auto-update Profile Project Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: auto-update-project-cards
  cancel-in-progress: false

jobs:
  update-project-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Update README project cards
        uses: actions/github-script@v7

        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace("refs/heads/", "");

            const START = "<!-- AUTO-PROJECTS:START -->";
            const END = "<!-- AUTO-PROJECTS:END -->";

            // Fetch the owner's public repositories.
            const repositories = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: owner,
                type: "public",
                sort: "updated",
                direction: "desc",
                per_page: 100
              }
            );

            // Exclude forks, archived repositories and the profile repo.
            const projects = repositories
              .filter(project =>
                !project.fork &&
                !project.archived &&
                project.name !== repo
              )
              .slice(0, 10);

            const escapeHtml = value =>
              String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");

            const cards = projects.map((project, index) => {
              const number = String(index + 1).padStart(2, "0");
              const name = escapeHtml(project.name);
              const description = escapeHtml(
                project.description || "A public project by " + owner + "."
              );
              const language = escapeHtml(
                project.language || "Not specified"
              );
              const url = escapeHtml(project.html_url);

              return `
            <td width="50%" valign="top">

            <img src="https://img.shields.io/badge/${number}-PROJECT-C5FF63?style=flat-square&labelColor=17191D" alt="Project ${number}" />

            <h3><a href="${url}">${name}</a></h3>

            <p>${description}</p>

            <sub>LANGUAGE: ${language} · ★ ${project.stargazers_count}</sub>

            <br/><br/>

            <a href="${url}">
              <img src="https://img.shields.io/badge/VIEW%20PROJECT-C5FF63?style=for-the-badge&logo=github&logoColor=111111" alt="View project" />
            </a>

            </td>`;
            });

            const rows = [];

            for (let i = 0; i < cards.length; i += 2) {
              rows.push(
                "<tr>\n" +
                cards[i] +
                "\n" +
                (cards[i + 1] || '<td width="50%"></td>') +
                "\n</tr>"
              );
            }

            const projectSection = cards.length
              ? "<table>\n" + rows.join("\n") + "\n</table>"
              : "<p>No eligible public projects found.</p>";

            // Read the profile README.
            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: "README.md",
              ref: branch
            });

            if (Array.isArray(response.data) ||
                !response.data.content) {
              throw new Error("README.md could not be read.");
            }

            const sha = response.data.sha;
            const current = Buffer.from(
              response.data.content,
              "base64"
            ).toString("utf8");

            const startIndex = current.indexOf(START);
            const endIndex = current.indexOf(END);

            if (
              startIndex === -1 ||
              endIndex === -1 ||
              endIndex < startIndex
            ) {
              throw new Error(
                "AUTO-PROJECTS markers are missing or incorrectly ordered."
              );
            }

            const contentStart = startIndex + START.length;

            const updated =
              current.slice(0, contentStart) +
              "\n\n" +
              projectSection +
              "\n\n" +
              current.slice(endIndex);

            if (updated === current) {
              core.info("Project cards are already up to date.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "README.md",
              message: "docs: automatically update project cards",
              content: Buffer.from(updated).toString("base64"),
              sha,
              branch
            });

            core.info(
              `Successfully updated ${projects.length} project cards.`
            );
