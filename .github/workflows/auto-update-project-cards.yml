
name: Auto-update Profile Project Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: auto-update-project-cards
  cancel-in-progress: false

jobs:
  update-project-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Update README project cards
        uses: actions/github-script@v7

        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace("refs/heads/", "");

            const START = "<!-- AUTO-PROJECTS:START -->";
            const END = "<!-- AUTO-PROJECTS:END -->";

            // Repositories already displayed as featured projects.
            const featuredRepos = new Set([
              "docflow",
              "metrorailmanagementsystem",
              "pharmmacy-management-system-dbms-",
              "library-management-system",
              "librarymanagementsystem",
              "automatic-fire-detection-alarm-system",
              "momin078"
            ]);

            // Escape text before inserting repository information into HTML.
            const escapeHtml = (value = "") =>
              String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
              })[char]);

            // Fetch all public repositories, not just the first few.
            const repositories = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: owner,
                type: "public",
                sort: "updated",
                direction: "desc",
                per_page: 100
              }
            );

            // Keep featured projects in their original section only.
            const projects = repositories.filter(project =>
              !featuredRepos.has(project.name.toLowerCase())
            );

            core.info(`Public repositories found: ${repositories.length}`);
            core.info(`Additional repositories: ${projects.length}`);

            // Build one HTML card for each remaining repository.
            const cards = projects.map((project, index) => {
              const number = String(index + 1).padStart(2, "0");
              const name = escapeHtml(project.name);
              const description = escapeHtml(
                project.description || "A public project by " + owner + "."
              );
              const language = escapeHtml(project.language || "Various");
              const url = escapeHtml(project.html_url);
              const stars = project.stargazers_count;

              return `
              <td width="50%" valign="top">

              <img src="https://img.shields.io/badge/${number}-PROJECT-C5FF63?style=flat-square&labelColor=17191D" alt="Project ${number}" />

              <h3><a href="${url}">${name}</a></h3>

              <p>${description}</p>

              <p><code>${language}</code> · ⭐ ${stars} stars</p>

              <a href="${url}">
                <img src="https://img.shields.io/badge/VIEW%20PROJECT-C5FF63?style=for-the-badge&logo=github&logoColor=111111" alt="View project" />
              </a>

              </td>`;
            });

            // Arrange cards into two-column rows.
            const rows = [];

            for (let i = 0; i < cards.length; i += 2) {
              const secondCard = cards[i + 1] ||
                '<td width="50%" valign="top"></td>';

              rows.push(`
              <tr>
              ${cards[i]}
              ${secondCard}
              </tr>`);
            }

            const projectSection = cards.length
              ? `<table width="100%">
              ${rows.join("\n")}
              </table>`
              : "<p>No additional public repositories found.</p>";

            // Read the current profile README.
            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: "README.md",
              ref: branch
            });

            if (Array.isArray(response.data) ||
                response.data.type !== "file") {
              throw new Error("README.md was not found.");
            }

            const current = Buffer.from(
              response.data.content,
              "base64"
            ).toString("utf8");

            const startIndex = current.indexOf(START);
            const endIndex = current.indexOf(END);

            if (
              startIndex === -1 ||
              endIndex === -1 ||
              endIndex < startIndex
            ) {
              throw new Error(
                "AUTO-PROJECTS markers are missing or incorrectly ordered."
              );
            }

            // Replace only the automatic section.
            // All other README content remains unchanged.
            const updated =
              current.slice(0, startIndex + START.length) +
              "\n<!-- This section is managed by GitHub Actions. -->\n\n" +
              projectSection +
              "\n\n" +
              current.slice(endIndex);

            if (updated === current) {
              core.info("Project cards are already up to date.");
              return;
            }

            // Save the updated README to the main branch.
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "README.md",
              message: "docs: automatically update project cards",
              content: Buffer.from(updated, "utf8").toString("base64"),
              sha: response.data.sha,
              branch
            });

            core.info(
              `Successfully updated ${projects.length} additional project cards.`
            );
